services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - default

  redis:
    image: redis:8.10.3
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - default

  django:
    build: .
    image: rezultat-alarm:latest
    container_name: django
    restart: always
    env_file:
      - .env
    environment:
    # Those env variables must point to docker service names, not localhost
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    entrypoint: ["/app/entrypoint.sh"]
    command: uv run gunicorn --bind 0.0.0.0:8000 --workers 3 apps.config.wsgi:application
    depends_on:
      - postgres
      - redis
    networks:
      - default
    ports:
      - "8000:8000"

  celery:
    image: rezultat-alarm:latest
    container_name: celery
    restart: always
    env_file:
      - .env
    environment:
      # Those env variables must point to docker service names, not localhost
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: uv run celery -A apps.config worker --loglevel=info
    depends_on:
      - postgres
      - redis
    networks:
      - default

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    driver: bridge
